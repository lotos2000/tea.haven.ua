<!DOCTYPE html>
<html lang="uk" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tea.haven.ua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1c1917; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #44403c; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #d97706; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleUp {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
        .animate-scale-up { animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-right { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .btn-active-scale { transition: transform 0.1s ease; }
        .btn-active-scale:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-stone-950 text-stone-200 font-sans min-h-screen flex flex-col antialiased selection:bg-amber-600 selection:text-white">

    <!-- Header -->
    <header class="bg-stone-900/90 backdrop-blur-md text-stone-100 sticky top-0 z-40 border-b border-stone-800 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex justify-between items-center gap-4">
            
            <!-- Logo -->
            <a href="#" class="flex items-center gap-3 group btn-active-scale">
                <div class="w-10 h-10 rounded-xl bg-amber-600/20 border border-amber-500/40 flex items-center justify-center text-amber-500 group-hover:bg-amber-600 group-hover:text-white transition duration-300 shadow-lg shadow-amber-600/10">
                    <i class="fa-solid fa-leaf text-lg"></i>
                </div>
                <div>
                    <span class="text-xl font-bold tracking-tight text-stone-100 block leading-none">tea.haven<span class="text-amber-500">.ua</span></span>
                    <span class="text-[10px] text-stone-400 uppercase tracking-widest font-medium">Чай та Посуд</span>
                </div>
            </a>

            <!-- Mode Switcher -->
            <div class="bg-stone-950 p-1 rounded-2xl border border-stone-800 flex items-center gap-1 shadow-inner">
                <button id="modeRetailBtn" onclick="setTradingMode('retail')" class="px-4 py-1.5 rounded-xl text-xs font-bold transition bg-amber-600 text-white shadow-md">
                    Роздріб
                </button>
                <button id="modeWholesaleBtn" onclick="setTradingMode('wholesale')" class="px-4 py-1.5 rounded-xl text-xs font-bold transition text-stone-400 hover:text-white">
                    Опт
                </button>
            </div>

            <!-- Cart Button -->
            <div class="flex items-center gap-3">
                <a href="https://t.me/FdDollar" target="_blank" class="hidden md:flex items-center gap-2 bg-stone-800 hover:bg-stone-700 text-stone-300 hover:text-white px-3.5 py-2 rounded-xl text-xs font-semibold border border-stone-700/60 transition btn-active-scale">
                    <i class="fa-brands fa-telegram text-amber-500 text-sm"></i>
                    <span>@FdDollar</span>
                </a>

                <button onclick="toggleCart()" class="relative bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-xl flex items-center gap-2.5 transition shadow-lg shadow-amber-600/20 font-medium text-sm btn-active-scale">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="hidden sm:inline">Кошик</span>
                    <span id="cartCount" class="bg-stone-950 text-amber-400 text-xs font-bold px-2 py-0.5 rounded-full min-w-[20px] text-center border border-amber-500/30">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex-grow w-full">

        <!-- Catalog Controls -->
        <div id="catalog" class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-6 gap-4 bg-stone-900/60 p-4 sm:p-5 rounded-2xl border border-stone-800/80 backdrop-blur-sm">
            <div>
                <h2 class="text-xl font-bold text-stone-100">Каталог</h2>
                <p id="statusText" class="text-xs text-stone-400 mt-1 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                    Завантаження...
                </p>
            </div>

            <!-- Search Bar -->
            <div class="relative w-full lg:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-500 text-sm"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" 
                    placeholder="Пошук..." 
                    class="w-full pl-10 pr-4 py-2 bg-stone-950 border border-stone-800 rounded-xl text-sm text-stone-200 placeholder-stone-500 focus:outline-none focus:border-amber-500 transition shadow-inner">
            </div>
        </div>

        <!-- Categories Filters -->
        <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-6 custom-scrollbar" id="categoryContainer"></div>

        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

        <!-- Scroll Trigger -->
        <div id="scrollTrigger" class="h-10 my-6 flex items-center justify-center">
            <span id="loadMoreSpinner" class="text-stone-500 text-sm hidden">
                <i class="fa-solid fa-spinner animate-spin mr-2"></i> Завантаження...
            </span>
        </div>

        <div id="emptyMessage" class="hidden text-center py-20 bg-stone-900/40 rounded-2xl border border-dashed border-stone-800">
            <i class="fa-solid fa-box-open text-4xl text-stone-600 mb-3 block"></i>
            <p class="text-stone-400 font-medium">Нічого не знайдено</p>
        </div>
    </main>

    <!-- Product Detail Modal -->
    <div id="productModal" class="fixed inset-0 z-50 overflow-y-auto hidden">
        <div onclick="closeProductModal()" class="fixed inset-0 bg-stone-950/80 backdrop-blur-md animate-fade-in"></div>

        <div class="flex min-h-full items-center justify-center p-4">
            <div class="relative w-full max-w-3xl rounded-3xl bg-stone-900 border border-stone-800 shadow-2xl overflow-hidden z-10 animate-scale-up">
                <button onclick="closeProductModal()" class="absolute top-4 right-4 z-20 w-9 h-9 rounded-full bg-stone-950/80 text-stone-400 hover:text-white flex items-center justify-center transition border border-stone-800 btn-active-scale">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>

                <div class="grid grid-cols-1 md:grid-cols-2">
                    <div class="h-72 md:h-full bg-stone-950 relative overflow-hidden flex items-center justify-center p-4">
                        <img id="modalImage" src="" alt="" class="max-h-full max-w-full object-contain rounded-xl">
                    </div>
                    <div class="p-6 sm:p-8 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center gap-2 mb-2">
                                <span id="modalCategory" class="text-[10px] uppercase font-bold tracking-wider px-2.5 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20"></span>
                                <span id="modalId" class="text-[10px] font-mono text-stone-500"></span>
                            </div>
                            <h3 id="modalTitle" class="text-xl font-bold text-white mb-4"></h3>
                            <div class="text-stone-300 text-sm space-y-3 leading-relaxed mb-6 custom-scrollbar max-h-48 overflow-y-auto pr-2" id="modalDescription"></div>
                        </div>

                        <div class="pt-4 border-t border-stone-800">
                            <div id="modalTierPrices" class="mb-4 text-xs space-y-1 bg-stone-950 p-3 rounded-xl border border-stone-800"></div>
                            <button id="modalAddBtn" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-3 rounded-xl font-bold text-sm shadow-lg shadow-amber-600/20 transition flex items-center justify-center gap-2 btn-active-scale">
                                <i class="fa-solid fa-cart-plus"></i>
                                <span>Додати до кошика</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Side Cart Drawer -->
    <div id="cartDrawer" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div onclick="toggleCart()" class="fixed inset-0 bg-stone-950/80 backdrop-blur-sm animate-fade-in"></div>

        <div class="fixed inset-y-0 right-0 pl-10 max-w-full flex">
            <div class="w-screen max-w-md bg-stone-900 border-l border-stone-800 shadow-2xl flex flex-col animate-slide-right">
                
                <div class="p-5 bg-stone-950 text-stone-100 flex justify-between items-center border-b border-stone-800">
                    <div class="flex items-center gap-2.5">
                        <i class="fa-solid fa-bag-shopping text-amber-500"></i>
                        <h2 class="text-lg font-bold">Кошик</h2>
                    </div>
                    <button onclick="toggleCart()" class="text-stone-400 hover:text-white transition btn-active-scale">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>

                <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-5 space-y-3 custom-scrollbar"></div>

                <!-- Footer & Checkout Form -->
                <div id="cartFooter" class="p-5 border-t border-stone-800 bg-stone-950/60 hidden">
                    <div class="flex justify-between items-center mb-3 text-stone-100">
                        <span class="text-sm font-medium text-stone-400">Всього:</span>
                        <span id="cartTotal" class="text-xl font-bold text-amber-400">0 грн</span>
                    </div>

                    <!-- Wholesale Alert Message -->
                    <div id="wholesaleMinAlert" class="hidden mb-3 p-2.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-medium">
                        <i class="fa-solid fa-circle-exclamation mr-1"></i>
                        <span id="wholesaleMinAlertText">Мінімальне оптове замовлення — від 7 000 грн</span>
                    </div>

                    <form id="orderForm" onsubmit="handleCheckout(event)" class="space-y-3">
                        <div>
                            <input type="text" id="custName" required placeholder="Ім'я та Прізвище" 
                                class="w-full px-3.5 py-2.5 text-sm bg-stone-900 border border-stone-700/80 rounded-xl text-stone-200 placeholder-stone-500 focus:outline-none focus:border-amber-500 transition">
                        </div>
                        <div>
                            <input type="tel" id="custPhone" required placeholder="Номер телефону" 
                                class="w-full px-3.5 py-2.5 text-sm bg-stone-900 border border-stone-700/80 rounded-xl text-stone-200 placeholder-stone-500 focus:outline-none focus:border-amber-500 transition">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="custCity" required placeholder="Місто" 
                                class="w-full px-3.5 py-2.5 text-sm bg-stone-900 border border-stone-700/80 rounded-xl text-stone-200 placeholder-stone-500 focus:outline-none focus:border-amber-500 transition">
                            <input type="text" id="custNP" required placeholder="№ НП" 
                                class="w-full px-3.5 py-2.5 text-sm bg-stone-900 border border-stone-700/80 rounded-xl text-stone-200 placeholder-stone-500 focus:outline-none focus:border-amber-500 transition">
                        </div>

                        <button type="submit" id="submitBtn" class="w-full mt-2 bg-amber-600 hover:bg-amber-500 disabled:bg-stone-800 disabled:text-stone-500 disabled:cursor-not-allowed text-white py-3 rounded-xl font-bold text-sm shadow-lg shadow-amber-600/20 transition flex items-center justify-center gap-2 btn-active-scale">
                            <span>Оформити замовлення</span>
                            <i class="fa-solid fa-paper-plane text-xs"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const TG_BOT_TOKEN = '8970897973:AAG1JZ-f2IgQElmMR_OdFvH2Pj9cOLz8txs';
        const TG_ADMIN_IDS = ['884682846', '8272212055'];
        const SHEET_ID = '1JGmsSCaG2UAXBrijz0lL6Mnn5tOge5CigejicJHEYT0';

        const DEFAULT_CATEGORIES = [
            'Всі товари', 'Шу Пуер', 'Шен Пуер', 'Улун', 
            'Зелений чай', 'Білий чай', 'Червоний чай', 
            'Гайвані', 'Чайники (Исин)', 'Піали', 'Чабані'
        ];

        const TEA_IMAGES = [
            "https://images.unsplash.com/photo-1576092768241-dec231879fc3?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1597481499750-3e6b22637e12?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1564890369478-c89ca6d9cde9?auto=format&fit=crop&w=800&q=80"
        ];

        let allProducts = [];
        let filteredProducts = [];
        let cart = [];
        let tradingMode = 'retail'; 
        let selectedCategory = 'Всі товари';
        
        const PAGE_SIZE = 20;
        let currentPage = 1;
        let searchTimeout = null;

        function cleanNumber(val) {
            if (!val) return 0;
            const num = parseFloat(String(val).replace(/[^0-9.]/g, ''));
            return isNaN(num) ? 0 : num;
        }

        function setTradingMode(mode) {
            tradingMode = mode;
            
            const retailBtn = document.getElementById('modeRetailBtn');
            const wholesaleBtn = document.getElementById('modeWholesaleBtn');

            if (mode === 'wholesale') {
                retailBtn.className = "px-4 py-1.5 rounded-xl text-xs font-bold transition text-stone-400 hover:text-white";
                wholesaleBtn.className = "px-4 py-1.5 rounded-xl text-xs font-bold transition bg-amber-600 text-white shadow-md";
            } else {
                retailBtn.className = "px-4 py-1.5 rounded-xl text-xs font-bold transition bg-amber-600 text-white shadow-md";
                wholesaleBtn.className = "px-4 py-1.5 rounded-xl text-xs font-bold transition text-stone-400 hover:text-white";
            }

            renderCurrentPage(true);
            updateCartUI();
        }

        function processImageUrl(rawUrl, index) {
            if (!rawUrl) return TEA_IMAGES[index % TEA_IMAGES.length];
            const urlMatch = rawUrl.match(/https?:\/\/[^\s"'\)]+/);
            if (!urlMatch) return TEA_IMAGES[index % TEA_IMAGES.length];

            let cleanUrl = urlMatch[0];
            if (cleanUrl.includes('drive.google.com')) {
                const driveIdMatch = cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || cleanUrl.match(/id=([a-zA-Z0-9_-]+)/);
                if (driveIdMatch && driveIdMatch[1]) {
                    return `https://lh3.googleusercontent.com/d/${driveIdMatch[1]}=w800`;
                }
            }
            return cleanUrl;
        }

        function detectCategory(name) {
            const lower = name.toLowerCase();
            if (lower.includes('шу') || lower.includes('shu')) return 'Шу Пуер';
            if (lower.includes('шен') || lower.includes('shen')) return 'Шен Пуер';
            if (lower.includes('улун') || lower.includes('тегуаньинь') || lower.includes('дахунпао')) return 'Улун';
            if (lower.includes('зелен') || lower.includes('лунцзин')) return 'Зелений чай';
            if (lower.includes('білий') || lower.includes('белый')) return 'Білий чай';
            if (lower.includes('червон') || lower.includes('красный')) return 'Червоний чай';
            if (lower.includes('гайвань')) return 'Гайвані';
            if (lower.includes('чайник') || lower.includes('исин')) return 'Чайники (Исин)';
            if (lower.includes('піал') || lower.includes('пиал')) return 'Піали';
            if (lower.includes('дошка') || lower.includes('чабань')) return 'Чабані';
            return 'Чай та Посуд';
        }

        async function loadData() {
            const statusText = document.getElementById('statusText');
            renderCategories();

            window.handleSheetData = function(data) {
                try {
                    if (!data || !data.table || !data.table.rows) throw new Error("Порожні дані");

                    const rows = data.table.rows;
                    const parsed = [];

                    rows.forEach((row, idx) => {
                        if (idx === 0) return;

                        const cells = row.c;
                        if (!cells) return;

                        const getValue = (i) => {
                            if (!cells[i] || cells[i].v === null || cells[i].v === undefined) return '';
                            return String(cells[i].f || cells[i].v).trim();
                        };

                        const getRawCell = (i) => {
                            if (!cells[i]) return '';
                            return `${cells[i].f || ''} ${cells[i].v || ''}`;
                        };

                        const name = getValue(1); 
                        if (!name || ['назва', 'название'].includes(name.toLowerCase())) return;

                        const productId = getValue(5) || String(250008 - idx); 
                        const rawImg = getRawCell(0); 
                        const finalImg = processImageUrl(rawImg, idx);

                        const opt15Val = cleanNumber(getValue(2)); 
                        const opt7Val  = cleanNumber(getValue(3)); 
                        const retailVal= cleanNumber(getValue(4)); 

                        parsed.push({
                            id: productId,
                            name: name,
                            priceRetail: retailVal,
                            priceOpt7: opt7Val || retailVal,
                            priceOpt15: opt15Val || opt7Val || retailVal,
                            category: detectCategory(name),
                            image: finalImg,
                            fallbackImg: TEA_IMAGES[idx % TEA_IMAGES.length],
                            description: `Артикул: ${productId}.`
                        });
                    });

                    allProducts = parsed;
                    applyFilters();

                    statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> Товарів: ${allProducts.length}`;
                    setupInfiniteScroll();

                } catch (err) {
                    console.error("Помилка:", err);
                    statusText.innerText = "Помилка завантаження";
                }
            };

            const script = document.createElement('script');
            script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:handleSheetData`;
            document.body.appendChild(script);
        }

        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            container.innerHTML = DEFAULT_CATEGORIES.map(cat => `
                <button onclick="setCategory('${cat}')" class="whitespace-nowrap px-4 py-2 rounded-xl text-xs font-semibold transition border btn-active-scale ${
                    selectedCategory === cat 
                    ? 'bg-amber-600 text-white border-amber-500 shadow-md shadow-amber-600/20' 
                    : 'bg-stone-900 text-stone-400 border-stone-800 hover:bg-stone-800 hover:text-stone-200'
                }">
                    ${cat}
                </button>
            `).join('');
        }

        function setCategory(cat) {
            selectedCategory = cat;
            renderCategories();
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            filteredProducts = allProducts.filter(p => {
                const matchesCat = selectedCategory === 'Всі товари' || p.category === selectedCategory;
                const matchesQuery = !query || p.name.toLowerCase().includes(query) || String(p.id).toLowerCase().includes(query);
                return matchesCat && matchesQuery;
            });

            renderCurrentPage(true);
        }

        function getCurrentProductPrice(product) {
            if (tradingMode === 'wholesale') {
                const currentCartOptTotal = cart.reduce((s, i) => s + (i.priceOpt7 * i.qty), 0);
                return currentCartOptTotal >= 15000 ? product.priceOpt15 : product.priceOpt7;
            }
            return product.priceRetail;
        }

        function renderCurrentPage(reset = false) {
            const grid = document.getElementById('productGrid');
            const emptyMsg = document.getElementById('emptyMessage');

            if (reset) {
                currentPage = 1;
                grid.innerHTML = '';
            }

            if (filteredProducts.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            }
            emptyMsg.classList.add('hidden');

            const start = (currentPage - 1) * PAGE_SIZE;
            const end = start + PAGE_SIZE;
            const itemsToRender = filteredProducts.slice(start, end);

            const fragment = document.createDocumentFragment();

            itemsToRender.forEach(item => {
                const activePrice = getCurrentProductPrice(item);

                const card = document.createElement('div');
                card.className = "bg-stone-900 rounded-2xl border border-stone-800 overflow-hidden flex flex-col justify-between hover:border-amber-500/50 transition-all duration-300 group animate-fade-in";
                
                card.innerHTML = `
                    <div>
                        <div class="h-52 overflow-hidden bg-stone-950 relative cursor-pointer" onclick="openProductModal('${item.id}')">
                            <img src="${item.image}" alt="${item.name}" loading="lazy" 
                                class="w-full h-full object-cover group-hover:scale-105 transition duration-500" 
                                onerror="this.onerror=null; this.src='${item.fallbackImg}';">
                            <span class="absolute top-2.5 right-2.5 text-[10px] font-mono font-semibold px-2 py-0.5 rounded-md bg-stone-950/80 text-stone-300 border border-stone-800 backdrop-blur-md">ID: ${item.id}</span>
                        </div>
                        <div class="p-4">
                            <h3 onclick="openProductModal('${item.id}')" class="text-sm font-bold text-stone-100 line-clamp-2 cursor-pointer hover:text-amber-400 transition">${item.name}</h3>
                        </div>
                    </div>
                    <div class="p-4 pt-0 flex items-center justify-between mt-auto">
                        <div>
                            <span class="text-lg font-extrabold text-amber-400">${activePrice} <span class="text-xs font-normal text-stone-400">грн</span></span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="openProductModal('${item.id}')" title="Детальніше" class="bg-stone-800 hover:bg-stone-700 text-stone-300 w-9 h-9 rounded-xl flex items-center justify-center transition border border-stone-700/60 btn-active-scale">
                                <i class="fa-solid fa-eye text-xs"></i>
                            </button>
                            <button onclick="addToCart('${item.id}')" title="В кошик" class="bg-amber-600 hover:bg-amber-500 text-white w-9 h-9 rounded-xl flex items-center justify-center shadow-lg shadow-amber-600/20 transition btn-active-scale">
                                <i class="fa-solid fa-cart-plus text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
                fragment.appendChild(card);
            });

            grid.appendChild(fragment);
        }

        function setupInfiniteScroll() {
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    if (currentPage * PAGE_SIZE < filteredProducts.length) {
                        currentPage++;
                        renderCurrentPage(false);
                    }
                }
            }, { rootMargin: '200px' });

            observer.observe(document.getElementById('scrollTrigger'));
        }

        function handleSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                applyFilters();
            }, 250);
        }

        function openProductModal(productId) {
            const product = allProducts.find(p => String(p.id) === String(productId));
            if (!product) return;

            document.getElementById('modalImage').src = product.image;
            document.getElementById('modalTitle').innerText = product.name;
            document.getElementById('modalCategory').innerText = product.category;
            document.getElementById('modalId').innerText = `ID: ${product.id}`;
            document.getElementById('modalDescription').innerText = product.description;

            document.getElementById('modalTierPrices').innerHTML = `
                <div class="flex justify-between"><span>Роздрібна ціна:</span><span class="font-bold text-stone-200">${product.priceRetail} грн</span></div>
                <div class="flex justify-between"><span>Опт від 7 000 грн:</span><span class="font-bold text-amber-400">${product.priceOpt7} грн</span></div>
                <div class="flex justify-between"><span>Опт від 15 000 грн:</span><span class="font-bold text-amber-500">${product.priceOpt15} грн</span></div>
            `;

            const addBtn = document.getElementById('modalAddBtn');
            addBtn.onclick = () => {
                addToCart(product.id);
                closeProductModal();
            };

            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        function addToCart(productId) {
            const product = allProducts.find(p => String(p.id) === String(productId));
            if (!product) return;

            const existingItem = cart.find(item => String(item.id) === String(productId));
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }

            updateCartUI();
            toggleCart(true);
        }

        function changeQty(productId, delta) {
            const item = cart.find(i => String(i.id) === String(productId));
            if (!item) return;

            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => String(i.id) !== String(productId));
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartCount = document.getElementById('cartCount');
            const container = document.getElementById('cartItemsContainer');
            const footer = document.getElementById('cartFooter');
            const totalEl = document.getElementById('cartTotal');

            // Показує кількість унікальних обраних позицій (якщо 1 товар — цифра 1)
            cartCount.innerText = cart.length;

            let totalSum = 0;

            if (tradingMode === 'wholesale') {
                const baseOpt7Total = cart.reduce((sum, item) => sum + (item.priceOpt7 * item.qty), 0);
                if (baseOpt7Total >= 15000) {
                    totalSum = cart.reduce((sum, item) => sum + (item.priceOpt15 * item.qty), 0);
                } else {
                    totalSum = baseOpt7Total;
                }
            } else {
                totalSum = cart.reduce((sum, item) => sum + (item.priceRetail * item.qty), 0);
            }

            totalEl.innerText = `${totalSum} грн`;

            const submitBtn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('wholesaleMinAlert');
            const alertText = document.getElementById('wholesaleMinAlertText');

            if (tradingMode === 'wholesale' && totalSum < 7000 && cart.length > 0) {
                submitBtn.disabled = true;
                alertBox.classList.remove('hidden');
                alertText.innerText = `Мінімальне замовлення оптом — 7 000 грн (додайте ще на ${7000 - totalSum} грн)`;
            } else {
                submitBtn.disabled = false;
                alertBox.classList.add('hidden');
            }

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-stone-500">
                        <i class="fa-solid fa-basket-shopping text-4xl mb-3 block opacity-30"></i>
                        <p class="text-sm">Кошик порожній</p>
                    </div>
                `;
                footer.classList.add('hidden');
                return;
            }

            footer.classList.remove('hidden');

            container.innerHTML = cart.map(item => {
                let itemPrice = item.priceRetail;
                if (tradingMode === 'wholesale') {
                    itemPrice = totalSum >= 15000 ? item.priceOpt15 : item.priceOpt7;
                }

                return `
                    <div class="flex items-center gap-3 bg-stone-950 p-3 rounded-xl border border-stone-800">
                        <img src="${item.image}" alt="${item.name}" class="w-12 h-12 object-cover rounded-lg bg-stone-900" onerror="this.onerror=null; this.src='${item.fallbackImg}';">
                        <div class="flex-1 min-w-0">
                            <h4 class="text-xs font-bold text-stone-200 truncate">${item.name}</h4>
                            <div class="flex items-center gap-2 mt-0.5">
                                <span class="text-xs text-amber-400 font-bold">${itemPrice} грн/шт</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 bg-stone-900 px-2 py-1 rounded-lg border border-stone-800">
                            <button onclick="changeQty('${item.id}', -1)" class="text-stone-400 hover:text-white text-xs px-1.5 py-0.5 btn-active-scale">-</button>
                            <span class="text-xs font-bold w-4 text-center text-amber-400">${item.qty}</span>
                            <button onclick="changeQty('${item.id}', 1)" class="text-stone-400 hover:text-white text-xs px-1.5 py-0.5 btn-active-scale">+</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleCart(forceOpen = false) {
            const drawer = document.getElementById('cartDrawer');
            if (forceOpen) {
                drawer.classList.remove('hidden');
            } else {
                drawer.classList.toggle('hidden');
            }
        }

        async function handleCheckout(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span>Обробка...</span>`;

            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const city = document.getElementById('custCity').value;
            const np = document.getElementById('custNP').value;

            let totalSum = 0;
            let itemsText = cart.map((item, idx) => {
                let price = item.priceRetail;
                if (tradingMode === 'wholesale') {
                    const tempOptSum = cart.reduce((s, i) => s + (i.priceOpt7 * i.qty), 0);
                    price = tempOptSum >= 15000 ? item.priceOpt15 : item.priceOpt7;
                }
                totalSum += price * item.qty;
                return `${idx + 1}. *${item.name}*\n   └ ID: \`${item.id}\` | ${item.qty} шт. x ${price} грн`;
            }).join('\n');

            const modeTitle = tradingMode === 'wholesale' 
                ? (totalSum >= 15000 ? 'ОПТ ВІД 15к' : 'ОПТ ВІД 7к') 
                : 'РОЗДРІБ';

            const message = `🛍 *НОВЕ ЗАМОВЛЕННЯ — tea.haven.ua*\n` +
                `------------------------------------\n` +
                `🏷 *Режим:* ${modeTitle}\n` +
                `👤 *Клієнт:* ${name}\n` +
                `📞 *Телефон:* ${phone}\n` +
                `📍 *Доставка:* м. ${city}, НП №${np}\n` +
                `------------------------------------\n` +
                `📦 *Товари:*\n${itemsText}\n` +
                `------------------------------------\n` +
                `💰 *Разом:* ${totalSum} грн`;

            try {
                for (const chatId of TG_ADMIN_IDS) {
                    await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: chatId,
                            text: message,
                            parse_mode: 'Markdown'
                        })
                    });
                }

                alert(`Дякуємо за замовлення, ${name}!`);
                cart = [];
                updateCartUI();
                toggleCart();
                document.getElementById('orderForm').reset();
            } catch (err) {
                console.error("Помилка:", err);
                alert("Помилка відправки. Напишіть у Telegram @FdDollar.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Оформити замовлення</span><i class="fa-solid fa-paper-plane text-xs"></i>`;
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
